server {
    listen 80;
    server_name tangchen02.top www.tangchen02.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/cc-acme; }
    location / { return 301 https://tangchen02.top$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.tangchen02.top;
    ssl_certificate /etc/letsencrypt/live/tangchen02.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangchen02.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://tangchen02.top$request_uri;
}
server {
    listen 443 ssl;
    server_name tangchen02.top;
    ssl_certificate /etc/letsencrypt/live/tangchen02.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangchen02.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://www.cloudflare.com https://api.anthropic.com https://claude.ai https://claude.com https://platform.claude.com https://anthropic.com https://claudeusercontent.com https://clau.de https://anthropic.auth0.com; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/cc-acme; }
    location = /cc-assistant { return 301 /apps/cc-assistant/$is_args$args; }
    location ~ ^/cc-assistant/(.*)$ { return 301 /apps/cc-assistant/$1$is_args$args; }
    location = /apps/cc-assistant { return 301 /apps/cc-assistant/$is_args$args; }
    location ^~ /apps/cc-assistant/ {
        alias /var/www/cc-assistant-site/;
    }
    root /var/www/tangchen-site;
    location / { try_files $uri $uri/ =404; }
}

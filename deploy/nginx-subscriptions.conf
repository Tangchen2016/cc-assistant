# Existing VLESS WebSocket locations remain untouched.
location ^~ /api/remote-subscriptions {
    client_max_body_size 2m;
    access_log off;
    proxy_pass http://127.0.0.1:19480;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}
location ^~ /remote-sub/ {
    access_log off;
    proxy_pass http://127.0.0.1:19480;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
}
location = /api/health {
    access_log off;
    proxy_pass http://127.0.0.1:19480;
}

name: CCAssistantIOS
options:
  bundleIdPrefix: local.subscription.studio
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  CCAssistantIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: ../desktop/native/AccountPoolStore.swift
      - path: ../desktop/native/AccountPoolModel.swift
      - path: ../desktop/native/AccountIdentity.swift
      - path: ../desktop/native/AccountConnectionStore.swift
      - path: ../desktop/native/AccountConnectionFlow.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: cc助手
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.subscription.studio.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  CCAssistantIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CCAssistantIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  CCAssistantIOS:
    build:
      targets:
        CCAssistantIOS: all
        CCAssistantIOSTests: [test]
    test:
      targets: [CCAssistantIOSTests]
